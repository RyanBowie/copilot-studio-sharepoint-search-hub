mcs.metadata:
  componentName: Greeting
  description: This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - Hello. Say Search SharePoint to search files and pages in All, CorpNet, HR, Finance, or IT. See up to five links with stored tags, then receive a private Excel workbook of the verified results by email. Use your own connector accounts; department selection never grants permission.
        speak:
          - Hello. Say Search SharePoint to search files and pages. See up to five links with stored tags, then receive the verified results in private Excel by email.

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22